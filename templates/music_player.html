<!-- Apple Music / Listen Now Redesigned Template -->
<div class="apple-music-app" id="apple_music_app">
  <!-- Top Navigation Header -->
  <div class="am-header">
    <div class="am-page-title">Listen Now</div>
    <div class="am-profile-avatar" onclick="openFilePicker_music()" title="Add Custom Track"></div>
  </div>

  <input type="file" id="fileInput_music" accept="audio/*" style="display: none" />

  <!-- Main Scrollable Feed -->
  <div class="am-content-scroll">
    <!-- Top Picks Section -->
    <div class="am-section">
      <div class="am-section-header">
        <div class="am-section-title">Top Picks</div>
        <div class="am-section-subtitle">Just Updated</div>
      </div>
      <div class="am-carousel" id="am_top_picks">
        <!-- Top picks cards rendered dynamically -->
      </div>
    </div>

    <!-- Recently Played Section -->
    <div class="am-section">
      <div class="am-section-header">
        <div class="am-section-title">
          <span>Recently Played</span>
          <i class="hgi-stroke hgi-arrow-right-01" style="font-size: 16px;"></i>
        </div>
      </div>
      <div class="am-recent-list" id="playlist_music">
        <!-- Track items rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Floating Glass Mini-Player Bar -->
  <div class="am-mini-player" id="am_mini_player">
    <div class="am-mini-art" id="am_mini_art"></div>
    <div class="am-mini-info">
      <div class="am-mini-title" id="popupTitle_music">Girls</div>
    </div>
    <div class="am-mini-controls">
      <div class="am-mini-btn" id="playPauseIcon_music" onclick="event.stopPropagation(); togglePlay_music()">
        <i class="hgi-stroke hgi-play" style="font-size: 22px;"></i>
      </div>
      <div class="am-mini-btn" onclick="event.stopPropagation(); nextTrack_music()">
        <i class="hgi-stroke hgi-next" style="font-size: 22px;"></i>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Tab Bar -->
  <div class="am-tab-bar">
    <div class="am-tab-item active">
      <i class="hgi-stroke hgi-play-circle"></i>
      <span>Listen Now</span>
    </div>
    <div class="am-tab-item">
      <i class="hgi-stroke hgi-grid"></i>
      <span>Browse</span>
    </div>
    <div class="am-tab-item">
      <i class="hgi-stroke hgi-radio"></i>
      <span>Radio</span>
    </div>
    <div class="am-tab-item">
      <i class="hgi-stroke hgi-folder-music"></i>
      <span>Library</span>
    </div>
    <div class="am-tab-item">
      <i class="hgi-stroke hgi-search-01"></i>
      <span>Search</span>
    </div>
  </div>

  <!-- Hidden native audio element -->
  <audio id="audioPlayer_music" controls style="display: none"></audio>
</div>
