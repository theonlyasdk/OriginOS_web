<!-- Compass Application (Minimal OPPO Style) -->
<div class="compass-app" id="compass_app">
  <!-- Top Navigation / Options Bar -->
  <div class="compass-top-bar">
    <div class="compass-title">Compass</div>
  </div>

  <!-- Main Dial Container -->
  <div class="compass-dial-container">
    <!-- Center Needle Indicator (Top tick) -->
    <div class="compass-indicator-tick"></div>

    <!-- Rotating Compass Dial -->
    <div class="compass-dial" id="compass_dial">
      <svg class="compass-svg" viewBox="0 0 300 300" id="compass_ticks_svg">
        <!-- SVG Ticks will be dynamically injected for precision -->
      </svg>
      <div class="compass-directions">
        <span class="dir-n">N</span>
        <span class="dir-e">E</span>
        <span class="dir-s">S</span>
        <span class="dir-w">W</span>
      </div>
    </div>

    <!-- Central Heading Display -->
    <div class="compass-center-display">
      <div class="compass-heading-number" id="compass_heading_num">0°</div>
      <div class="compass-heading-cardinal" id="compass_heading_cardinal">North</div>
    </div>
  </div>

  <!-- Primary Direction Label -->
  <div class="compass-main-label" id="compass_main_label">North</div>

  <!-- Coordinates & Location Stats -->
  <div class="compass-coords-container">
    <div class="coord-box">
      <div class="coord-tag">LATITUDE</div>
      <div class="coord-value" id="compass_lat">36°43'32" N</div>
    </div>
    <div class="coord-box">
      <div class="coord-tag">LONGITUDE</div>
      <div class="coord-value" id="compass_lon">4°29'1" W</div>
    </div>
  </div>

  <!-- Bottom Mode Switcher (Compass / Level) -->
  <div class="compass-bottom-bar">
    <div class="compass-tab active" id="tab_compass">
      <div class="tab-icon">
        <svg xmlns="http://www.w3.org/2000/svg" height="22px" width="22px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" />
          <polygon points="15.5,8.5 13.2,13.2 8.5,15.5 10.8,10.8" fill="currentColor" stroke="none" />
        </svg>
      </div>
      <span>Compass</span>
    </div>
    <div class="compass-tab" id="tab_level">
      <div class="tab-icon">
        <svg xmlns="http://www.w3.org/2000/svg" height="22px" width="22px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" />
          <line x1="5.5" y1="12" x2="18.5" y2="12" />
          <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none" />
        </svg>
      </div>
      <span>Level</span>
    </div>
  </div>
</div>
