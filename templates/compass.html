<!-- Compass Application (Minimal OPPO Style) -->
<div class="compass-app" id="compass_app">
  <!-- Top Navigation / Options Bar -->
  <div class="compass-top-bar">
    <div class="compass-title">Compass</div>
    <div class="compass-settings-btn" id="compass_settings_btn">
      <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#888">
        <path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm112-280q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35Z"/>
      </svg>
    </div>
  </div>

  <!-- Main Dial Container -->
  <div class="compass-dial-container">
    <!-- Center Needle Indicator (Top tick) -->
    <div class="compass-indicator-tick"></div>

    <!-- Rotating Compass Dial -->
    <div class="compass-dial" id="compass_dial">
      <svg class="compass-svg" viewBox="0 0 300 300" id="compass_ticks_svg">
        <!-- SVG Ticks will be dynamically injected for precision -->
      </svg>
      <div class="compass-directions">
        <span class="dir-n">N</span>
        <span class="dir-e">E</span>
        <span class="dir-s">S</span>
        <span class="dir-w">W</span>
      </div>
    </div>

    <!-- Central Heading Display -->
    <div class="compass-center-display">
      <div class="compass-heading-number" id="compass_heading_num">0°</div>
      <div class="compass-heading-cardinal" id="compass_heading_cardinal">North</div>
    </div>
  </div>

  <!-- Primary Direction Label -->
  <div class="compass-main-label" id="compass_main_label">North</div>

  <!-- Coordinates & Location Stats -->
  <div class="compass-coords-container">
    <div class="coord-box">
      <div class="coord-tag">LATITUDE</div>
      <div class="coord-value" id="compass_lat">36°43'32" N</div>
    </div>
    <div class="coord-box">
      <div class="coord-tag">LONGITUDE</div>
      <div class="coord-value" id="compass_lon">4°29'1" W</div>
    </div>
  </div>

  <!-- Bottom Mode Switcher (Compass / Level) -->
  <div class="compass-bottom-bar">
    <div class="compass-tab active" id="tab_compass">
      <div class="tab-icon">
        <svg xmlns="http://www.w3.org/2000/svg" height="22px" viewBox="0 -960 960 960" width="22px" fill="currentColor">
          <path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm160-440-240 80 80-240 240-80-80 240Z"/>
        </svg>
      </div>
      <span>Compass</span>
    </div>
    <div class="compass-tab" id="tab_level">
      <div class="tab-icon">
        <svg xmlns="http://www.w3.org/2000/svg" height="22px" viewBox="0 -960 960 960" width="22px" fill="currentColor">
          <path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm-40-200h80v-80h-80v80Zm0-160h80v-80h-80v80Z"/>
        </svg>
      </div>
      <span>Level</span>
    </div>
  </div>
</div>
