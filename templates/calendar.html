<!-- iOS Inspired Calendar Application Template -->
<div class="calendar-app" id="calendar_app">
  <!-- Top Navigation Bar -->
  <div class="calendar-nav-bar">
    <div class="cal-nav-left" id="cal_prev_month_btn">
      <i class="hgi-stroke hgi-arrow-left-01" style="font-size: 1.15rem;"></i>
      <span id="cal_year_btn">2026</span>
    </div>
    <div class="cal-nav-right">
      <!-- Search Button -->
      <div class="cal-icon-btn" id="cal_search_btn">
        <i class="hgi-stroke hgi-search-01" style="font-size: 1.25rem;"></i>
      </div>
      <!-- Add Event Button -->
      <div class="cal-icon-btn" id="cal_add_event_btn">
        <i class="hgi-stroke hgi-plus-sign" style="font-size: 1.3rem;"></i>
      </div>
    </div>
  </div>

  <!-- Month Title Header -->
  <div class="cal-month-header">
    <div class="cal-month-title" id="cal_month_title">April</div>
  </div>

  <!-- Weekday Labels -->
  <div class="cal-weekdays">
    <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
  </div>

  <!-- Views Wrapper -->
  <div class="cal-views-wrapper">
    <!-- Month View Grid -->
    <div class="cal-month-grid" id="cal_month_grid">
      <!-- Dynamically filled with day cells and event pills -->
    </div>

    <!-- Day Timeline View -->
    <div class="cal-day-view" id="cal_day_view">
      <div class="cal-day-header-banner" id="cal_day_header_banner">
        Wednesday — Apr 1, 2026
      </div>
      <div class="cal-hours-timeline" id="cal_hours_timeline">
        <!-- 24 hourly rows generated by JS -->
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <div class="cal-bottom-bar">
    <div class="cal-today-btn" id="cal_today_btn">Today</div>
    <div class="cal-segmented-controls">
      <div class="cal-seg-btn active" id="cal_seg_month">
        <i class="hgi-stroke hgi-calendar-03" style="font-size: 1rem;"></i>
        <span>Month</span>
      </div>
      <div class="cal-seg-btn" id="cal_seg_day">
        <i class="hgi-stroke hgi-clock-01" style="font-size: 1rem;"></i>
        <span>Day</span>
      </div>
    </div>
  </div>

  <!-- Modal for Adding New Event (Bottom Sheet with Drag Handle) -->
  <div class="cal-modal-backdrop" id="cal_event_modal">
    <div class="cal-modal-card" id="cal_modal_card">
      <div class="cal-sheet-drag-handle" id="cal_sheet_drag_handle"></div>
      <div class="cal-modal-header">
        <div class="cal-modal-close" id="cal_modal_cancel_btn">
          <i class="hgi-stroke hgi-cancel-01" style="font-size: 1rem;"></i>
        </div>
        <div class="cal-modal-title">New Event</div>
        <div class="cal-modal-save" id="cal_modal_save_btn">
          <i class="hgi-stroke hgi-checkmark-circle-02" style="font-size: 1.15rem;"></i>
        </div>
      </div>

      <div class="cal-input-group">
        <input type="text" class="cal-input-field" id="cal_new_title" placeholder="Event Title" />
        <div class="cal-input-divider"></div>
        <input type="text" class="cal-input-field" id="cal_new_location" placeholder="Location or Video Call" />
      </div>

      <div class="cal-form-row">
        <span>Starts</span>
        <span class="cal-form-badge" id="cal_modal_date_badge">Apr 1, 2026</span>
      </div>

      <div class="cal-form-row">
        <span>Time</span>
        <input type="time" id="cal_new_time" value="12:00" style="border:none; background:transparent; color:inherit; font-weight:600;" />
      </div>
    </div>
  </div>
</div>
