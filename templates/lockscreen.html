<!-- Lock Screen Template -->
<div class="footer-text2" id="longer_finger">Keep holding...</div>
<div class="lock-content" id="lock_content">
  <div class="date-display" id="dateText" style="z-index: -2"></div>
  <div class="lock-clock" id="lockclock"></div>
</div>

<div class="container_password">
  <div
    class="footer-text"
    id="fogot_password"
    style="
      bottom: 30px;
      font-size: 15px;
      text-decoration: underline;
      z-index: 123212;
      pointer-events: auto;
      font-weight: bold;
      font-family: 'noto sans', sans-serif;
      color: white;
      display: none;
    "
  >
    Forgot password?
  </div>
  <div class="message_password" id="message_password"></div>

  <div class="dots_password" id="dots_password">
    <div class="dot_password"></div>
    <div class="dot_password"></div>
    <div class="dot_password"></div>
    <div class="dot_password"></div>
    <div class="dot_password"></div>
    <div class="dot_password"></div>
  </div>

  <div class="keypad_password" id="keypad_password">
    <!-- Generated dynamically via lockscreen module -->
  </div>
</div>

<div id="swipe_handle"></div>

<div class="lock-fingerprint" id="unlock-btn" style="z-index: 1">
  <div
    class="lock-fingerprint"
    id="unlock-btn2"
    style="
      position: absolute;
      bottom: -145px;
      width: 360px;
      height: 360px;
      pointer-events: none;
    "
  ></div>
</div>
